<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Exam</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside class="sidebar"><div class="logo">OEMS</div><div class="role">FACULTY</div><a href="faculty-dashboard.html">Dashboard</a><a href="question-bank.html">Question Bank</a><a href="add-question.html">Add Question</a><a class="active" href="create-exam.html">Create Exam</a><a href="scheduled-exams.html">Scheduled Exams</a><a href="result.html">Results</a><a href="index.html">Logout</a></aside>
<main class="main"><header><div><h2>Create Exam</h2><p class="muted">Configure and schedule a new examination</p></div></header>
<div class="panel form-panel"><form onsubmit="createExam(event)"><div class="grid2"><div><label>Exam Title</label><input required placeholder="e.g. DBMS Internal Assessment"></div><div><label>Subject</label><input required placeholder="DBMS"></div><div><label>Date</label><input type="date" required></div><div><label>Start Time</label><input type="time" required></div><div><label>Duration (minutes)</label><input type="number" value="60" min="10"></div><div><label>Target Group</label><select><option>CSE - 2025 Batch</option><option>CSE - 2026 Batch</option></select></div><div><label>Negative Marking</label><select><option>None</option><option>0.25 per wrong answer</option><option>0.50 per wrong answer</option></select></div><div><label>Question Selection</label><select><option>Manual Selection</option><option>Random by Difficulty</option></select></div></div><label>Select Questions</label><div class="checklist"><label><input type="checkbox" checked> Q001 - What is a primary key? (2 marks)</label><label><input type="checkbox" checked> Q002 - Explain process scheduling. (5 marks)</label><label><input type="checkbox"> Q003 - What is TCP three-way handshake? (5 marks)</label></div><div class="form-actions"><a class="secondary" href="faculty-dashboard.html">Cancel</a><button class="primary" type="submit">Save & Publish</button></div></form></div></main></div><script src="js/script.js"></script></body></html>
