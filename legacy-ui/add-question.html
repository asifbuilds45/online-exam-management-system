<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Question</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside class="sidebar"><div class="logo">OEMS</div><div class="role">FACULTY</div><a href="faculty-dashboard.html">Dashboard</a><a href="question-bank.html">Question Bank</a><a class="active" href="add-question.html">Add Question</a><a href="create-exam.html">Create Exam</a><a href="scheduled-exams.html">Scheduled Exams</a><a href="result.html">Results</a><a href="index.html">Logout</a></aside>
<main class="main"><header><div><h2>Add Question</h2><p class="muted">Create a new MCQ</p></div></header>
<div class="panel form-panel"><form onsubmit="saveQuestion(event)"><label>Question</label><textarea required placeholder="Enter question text"></textarea><div class="grid2"><div><label>Option A</label><input required></div><div><label>Option B</label><input required></div><div><label>Option C</label><input required></div><div><label>Option D</label><input required></div><div><label>Correct Answer</label><select><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div><label>Subject</label><input placeholder="e.g. DBMS" required></div><div><label>Topic</label><input placeholder="e.g. SQL"></div><div><label>Difficulty</label><select><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div><label>Marks</label><input type="number" value="2" min="1"></div></div><div class="form-actions"><a class="secondary" href="question-bank.html">Cancel</a><button class="primary" type="submit">Save Question</button></div></form></div></main></div><script src="js/script.js"></script></body></html>
